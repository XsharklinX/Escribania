[package]
name = "firma"
version = "1.0.0"
description = "Firma las versiones de Escribanía para el actualizador (ed25519)"
authors = ["David Bonilla"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23"
sha2 = "0.10"
