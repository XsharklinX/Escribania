[package]
name = "escribania-setup"
# La versión que se instala sale de src-tauri/tauri.conf.json (ver build.rs).
version = "1.0.0"
description = "Instalador de Escribanía"
authors = ["David Bonilla"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
# La activa scripts/build-installer.ps1: incrusta la interfaz (ui/) en el ejecutable.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
