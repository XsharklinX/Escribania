[package]
name = "escribania"
version = "0.8.0"
description = "Escribanía - software libre para escritores"
authors = ["David Bonilla"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "escribania_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13"
base64 = "0.23"
ureq = "3.4"
tauri-plugin-global-shortcut = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
quick-xml = "0.42"
# Vista de pliegos de la Imprenta: páginas como imagen.
typst-render = "0.15.1"
# Actualizador: comprobar la firma ed25519 y la huella de cada descarga.
ed25519-dalek = "2"
sha2 = "0.10"

[target."cfg(windows)".dependencies]
# Actualizar la versión que muestra "Aplicaciones instaladas".
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
